		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<meta name='apple-mobile-web-app-capable' content='yes'><meta name='mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'><meta name='apple-mobile-web-app-title' content='Байеры против Модерации'><style>@media (orientation: portrait) and (pointer: coarse) { body::after { content: '↻\A\AПоверни телефон горизонтально'; white-space: pre; position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; text-align: center; background: #1f2440; color: #fff; font: 600 22px/1.4 system-ui, sans-serif; } }</style><div id='homehint' style='display:none;position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:20;max-width:92vw;padding:8px 36px 8px 14px;border-radius:14px;background:#1f2440;color:#fff;font:600 14px/1.35 system-ui,sans-serif;box-shadow:0 3px 0 #0b0e1f'><span id='homehint_t'></span><span onclick="this.parentNode.remove();try{localStorage.setItem('homehint','1')}catch(e){}" style='position:absolute;right:10px;top:6px;font-size:20px;cursor:pointer'>×</span></div><script>window.addEventListener('load',function(){var ua=navigator.userAgent;var ios=/iPhone|iPad|iPod/.test(ua);var touch=matchMedia('(pointer: coarse)').matches;var app=navigator.standalone||matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;var cramped=touch&&Math.min(innerWidth,innerHeight)<340;var seen=false;try{seen=localStorage.getItem('homehint')==='1'}catch(e){}var h=document.getElementById('homehint');if(app||seen||!h||!(ios||cramped))return;document.getElementById('homehint_t').textContent=ios?'На весь экран: «Поделиться» → «Ещё» → «На экран Домой». Из мессенджера сначала открой в Safari.':'На весь экран: открой в Chrome → меню ⋮ → «Установить приложение».';h.style.display='block';setTimeout(function(){h.remove()},14000)});</script><script>if('serviceWorker' in navigator){var swT0=Date.now();navigator.serviceWorker.getRegistration().then(function(r){if(!r)return;function go(w){if(w&&navigator.serviceWorker.controller&&Date.now()-swT0<20000)w.postMessage('update')}function track(w){if(!w)return;if(w.state==='installed')go(w);else w.addEventListener('statechange',function(){if(w.state==='installed')go(w)})}track(r.waiting);track(r.installing);r.addEventListener('updatefound',function(){track(r.installing)});r.update()})}</script>

			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9638968,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
